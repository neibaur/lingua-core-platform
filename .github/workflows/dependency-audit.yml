# dependency-audit.yml
#
# Weekly audit of the committed lockfile. When `pnpm audit` reports an open
# advisory, this opens one tracking issue, or comments on the open one when
# the set of advisories has changed: high and critical advisories with a 7-day
# deadline, moderate and low ones with a 30-day target.
#
# Why this exists: the pull-request gate fails only a pull request that
# INTRODUCES a high or critical advisory. Advisories that are already on main
# do not block unrelated work, so they need their own alarm and a deadline.
# Policy: neibaur-labs/agent-ops docs/adr/0001.
#
# The audit itself is the shared, tested action in neibaur-labs/ci-workflows,
# pinned by commit. Nothing here changes a dependency.
name: dependency-audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - uses: neibaur-labs/ci-workflows/.github/actions/dependency-audit@2befad471a13a32cdeece3df6a33260da46ba13e # v1.1.0
