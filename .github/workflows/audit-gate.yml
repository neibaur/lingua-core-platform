# audit-gate.yml
#
# Fails a pull request that introduces a high or critical advisory: it audits
# the base branch and the pull request and compares them. Advisories already
# on the base branch are warnings; the weekly dependency-audit workflow
# raises those. Policy: neibaur-labs/agent-ops docs/adr/0001.
#
# The gate itself is the shared, tested action in neibaur-labs/ci-workflows,
# pinned by commit.
name: audit-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-gate:
    name: audit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - uses: neibaur-labs/ci-workflows/.github/actions/audit-gate@4245e598bdf3331400096b9e5468d842222e95cc # v1.0.0
