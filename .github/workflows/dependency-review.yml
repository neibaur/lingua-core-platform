name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The written policy gates on high and critical advisories
          # (neibaur-labs/agent-ops docs/adr/0001). Moderate and low ones are
          # listed in the weekly dependency-audit issue instead. With the
          # default (low), an advisory that is deliberately left open fails
          # every pull request that touches the lockfile.
          fail-on-severity: high
